name: Publish Erasmus Frontend

on:
  push:
    branches: [frontend]

env:
  AZURE_WEBAPP_NAME: recovisionfrontend
  AZURE_WEBAPP_PACKAGE_PATH: "./dist"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 4️⃣ Build Expo web app
      - name: Build Expo web app
        run: npx expo export -p web

      # 5️⃣ Verify build output
      - name: Verify build output
        run: |
          echo "=== Files in dist folder ==="
          ls -lh dist || echo "dist folder not found!"

      # 6️⃣ Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_FRONTEND }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
